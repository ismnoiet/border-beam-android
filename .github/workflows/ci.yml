name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests
        run: ./gradlew :borderbeam:testDebugUnitTest
      - name: Build AAR
        run: ./gradlew :borderbeam:assembleRelease
      - name: Build demo
        run: ./gradlew :borderbeam-demo:assembleDebug
